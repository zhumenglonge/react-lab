name: Deploy to GitHub Pages

on:
  # 推到 main 分支时自动部署
  push:
    branches: [main]
  # 允许手动触发（Actions 页面点按钮）
  workflow_dispatch:

# 权限：读取代码 + 写 Pages + 拿 id-token
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，后触发的会取消前面的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
